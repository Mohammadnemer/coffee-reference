<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brew Card</title>
<meta name="description" content="Personal coffee recipe reference with scaling and step timers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&display=swap">
<style>
/* ---------- Tokens ---------- */
:root {
  --bg: #F2F3F1;
  --surface: #FFFFFF;
  --surface-2: #E9EBE8;
  --ink: #161615;
  --ink-2: #5B5E59;
  --line: rgba(22, 22, 21, .10);
  --line-strong: rgba(22, 22, 21, .22);
  --accent: #F2B544;
  --accent-ink: #8A5300;
  --on-accent: #1C1405;
  --heart: #E3264B;
  --focus: #2D6BFF;
  --glass: rgba(255, 255, 255, .72);
  --photo-fallback: #2B2724;
  --shade: rgba(10, 10, 9, .55);
  color-scheme: light;

  --font: "Readex Pro", "Segoe UI", Tahoma, "Noto Sans Arabic", "Geeza Pro", system-ui, sans-serif;
  --r-lg: 24px;
  --r-md: 16px;
  --r-sm: 10px;
  --tap: 44px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E0D0C;
    --surface: #191816;
    --surface-2: #24221F;
    --ink: #F3F0EA;
    --ink-2: #A8A299;
    --line: rgba(255, 255, 255, .08);
    --line-strong: rgba(255, 255, 255, .2);
    --accent: #F2B544;
    --accent-ink: #F2B544;
    --on-accent: #1C1405;
    --heart: #FF5A78;
    --focus: #8AB0FF;
    --glass: rgba(20, 19, 17, .72);
    --shade: rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E0D0C;
  --surface: #191816;
  --surface-2: #24221F;
  --ink: #F3F0EA;
  --ink-2: #A8A299;
  --line: rgba(255, 255, 255, .08);
  --line-strong: rgba(255, 255, 255, .2);
  --accent: #F2B544;
  --accent-ink: #F2B544;
  --on-accent: #1C1405;
  --heart: #FF5A78;
  --focus: #8AB0FF;
  --glass: rgba(20, 19, 17, .72);
  --shade: rgba(0, 0, 0, .7);
  color-scheme: dark;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html.locked { overflow: hidden; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
  overflow-x: hidden;
}
button, input { font: inherit; color: inherit; }
img { display: block; max-width: 100%; }
svg { display: block; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ---------- Header ---------- */
.top {
  position: sticky; top: 0; z-index: 20;
  background: var(--glass);
  -webkit-backdrop-filter: saturate(1.6) blur(18px);
  backdrop-filter: saturate(1.6) blur(18px);
  border-block-end: 1px solid var(--line);
}
.bar {
  display: flex; align-items: center; gap: 6px;
  max-width: 1180px; margin-inline: auto;
  padding-block: 8px; padding-inline: 16px 10px;
}
.brand { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 1.1rem; font-weight: 600; flex: 1; min-width: 0; letter-spacing: -.01em; }
.brand-mark {
  width: 34px; height: 34px; flex: none; border-radius: 11px;
  background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center;
}
.brand-mark svg { width: 20px; height: 20px; }
.icon-btn {
  min-width: var(--tap); min-height: var(--tap);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding-inline: 12px; border-radius: 999px;
  background: transparent; border: 1px solid var(--line); cursor: pointer; font-weight: 500; font-size: .92rem;
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn.round { padding-inline: 0; width: var(--tap); }

/* ---------- Filter bar (inside sticky header) ---------- */
.filters { max-width: 1180px; margin-inline: auto; padding-block: 0 10px; }
.frow {
  display: flex; align-items: center; gap: 8px;
  overflow-x: auto; scrollbar-width: none;
  padding-inline: 16px; padding-block: 3px;
}
.frow::-webkit-scrollbar { display: none; }
.flabel { flex: none; font-size: .8rem; color: var(--ink-2); min-width: 3.4em; }
.chip {
  flex: none; min-height: var(--tap);
  display: inline-flex; align-items: center; gap: 7px;
  padding-inline: 16px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line);
  cursor: pointer; white-space: nowrap; font-size: .92rem; font-weight: 500;
}
.chip:hover { border-color: var(--line-strong); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip svg { width: 16px; height: 16px; }
.chip.fav-chip svg { color: var(--heart); }
.chip.fav-chip[aria-pressed="true"] .fill { fill: currentColor; }
.fsep { flex: none; width: 1px; height: 24px; background: var(--line-strong); margin-inline: 2px; }

/* ---------- Hero ---------- */
.hero {
  position: relative; overflow: hidden;
  max-width: 1180px; margin: 16px auto 0; margin-inline: 16px;
  border-radius: var(--r-lg);
  min-height: 220px;
  background: var(--photo-fallback);
  color: #fff;
  display: flex; flex-direction: column; justify-content: flex-end;
}
@media (min-width: 1212px) { .hero { margin-inline: auto; } }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,.05) 0%, rgba(0,0,0,.25) 40%, rgba(0,0,0,.82) 100%);
}
.hero-body { position: relative; z-index: 1; padding: 22px 20px 20px; }
.hero h2 { margin: 0; font-size: clamp(1.6rem, 6vw, 2.6rem); line-height: 1.15; font-weight: 600; letter-spacing: -.02em; max-width: 18ch; }
.hero p { margin: 6px 0 14px; color: rgba(255,255,255,.82); max-width: 44ch; }
.search {
  display: flex; align-items: center; gap: 8px;
  max-width: 460px; min-height: 50px; padding-inline: 16px;
  background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-radius: 999px;
}
.search svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.search input {
  flex: 1; min-width: 0; min-height: 48px; background: transparent; border: 0; color: #fff; outline: none;
}
.search input::placeholder { color: rgba(255,255,255,.7); }
.search:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.search input::-webkit-search-cancel-button { filter: invert(1); }

/* ---------- Main ---------- */
main { max-width: 1180px; margin-inline: auto; padding-block: 18px 110px; padding-inline: 16px; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
#count { margin: 0; color: var(--ink-2); font-size: .92rem; }
#count strong { color: var(--ink); font-weight: 600; }
.sorter { position: relative; display: flex; align-items: center; gap: 8px; }
.sorter label { flex: none; font-size: .85rem; color: var(--ink-2); }
.sorter select {
  appearance: none; -webkit-appearance: none;
  min-height: var(--tap); padding-inline: 14px 38px; border-radius: 999px;
  background: var(--surface); border: 1px solid var(--line); cursor: pointer;
  font-size: .92rem; font-weight: 500;
}
.sorter select:hover { border-color: var(--line-strong); }
.sorter::after {
  content: ""; position: absolute; inset-inline-end: 16px; inset-block-start: 50%;
  width: 8px; height: 8px; pointer-events: none;
  /* physical sides on purpose: the chevron must point down in both directions */
  border-right: 2px solid var(--ink-2); border-bottom: 2px solid var(--ink-2);
  transform: translateY(-70%) rotate(45deg);
}

.group { margin-block-start: 22px; }
.banner {
  position: relative; overflow: hidden; border-radius: var(--r-lg);
  height: 108px; margin-block-end: 12px; background: var(--photo-fallback); color: #fff;
  display: flex; align-items: flex-end;
}
.banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.75), rgba(0,0,0,.15)); }
[dir="rtl"] .banner::after { background: linear-gradient(270deg, rgba(0,0,0,.75), rgba(0,0,0,.15)); }
.banner h2 { position: relative; z-index: 1; margin: 0; padding: 16px 20px; font-size: 1.35rem; font-weight: 600; display: flex; align-items: baseline; gap: 10px; }
.banner h2 .n { font-size: .85rem; font-weight: 400; color: rgba(255,255,255,.78); }

.grid { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 480px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 900px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; } }

.card { position: relative; border-radius: var(--r-lg); overflow: hidden; background: var(--photo-fallback); isolation: isolate; }
.card-open {
  position: relative; display: block; width: 100%; padding: 0; border: 0; cursor: pointer;
  text-align: start; color: #fff; background: transparent;
  aspect-ratio: 4 / 3;
}
@media (min-width: 480px) { .card-open { aspect-ratio: 4 / 5; } }
.card-open img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card-open::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,.28) 0%, rgba(0,0,0,0) 28%, rgba(0,0,0,.1) 48%, rgba(0,0,0,.86) 100%);
}
.card-open:focus-visible { outline-offset: -4px; border-radius: var(--r-lg); }
.c-top { position: absolute; z-index: 1; inset-block-start: 12px; inset-inline: 12px 64px; display: flex; flex-wrap: wrap; gap: 6px; }
.c-bottom { position: absolute; z-index: 1; inset-inline: 0; inset-block-end: 0; padding: 16px; display: flex; flex-direction: column; gap: 4px; }
.c-name { font-size: 1.3rem; font-weight: 600; line-height: 1.2; letter-spacing: -.01em; }
.c-blurb { font-size: .9rem; line-height: 1.45; color: rgba(255,255,255,.84); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.c-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-block-start: 6px; }
.glass {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: .76rem; line-height: 1; font-weight: 500;
  padding: 6px 10px; border-radius: 999px;
  background: rgba(0,0,0,.38); color: #fff;
  border: 1px solid rgba(255,255,255,.18);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.glass svg { width: 13px; height: 13px; }
.glass.time { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
.glass .u { color: rgba(255,255,255,.72); margin-inline-start: 4px; }

.heart {
  position: absolute; z-index: 2; inset-block-start: 8px; inset-inline-end: 8px;
  width: var(--tap); height: var(--tap); border-radius: 999px;
  display: inline-flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.38); color: #fff; border: 1px solid rgba(255,255,255,.2);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  cursor: pointer;
}
.heart svg { width: 21px; height: 21px; }
.heart .fill { fill: none; }
.heart[aria-pressed="true"] { color: var(--heart); background: #fff; }
.heart[aria-pressed="true"] .fill { fill: currentColor; }

.empty {
  position: relative; overflow: hidden; border-radius: var(--r-lg);
  padding: 28px 20px; color: #fff; background: var(--photo-fallback); margin-block-start: 8px;
}
.empty img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .35; }
.empty > div { position: relative; }
.empty h2 { margin: 0 0 4px; font-size: 1.2rem; font-weight: 600; }
.empty p { margin: 0 0 14px; color: rgba(255,255,255,.8); }
.clears { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  min-height: var(--tap); padding-inline: 16px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500;
  background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.3);
}
.btn:hover { background: rgba(255,255,255,.24); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn svg { width: 15px; height: 15px; }

footer.credits {
  max-width: 1180px; margin: 0 auto; padding: 0 16px 120px; color: var(--ink-2); font-size: .82rem;
}
footer.credits a { color: var(--ink); }

/* ---------- Mini timer ---------- */
.mini {
  position: fixed; z-index: 30;
  inset-inline: 16px; inset-block-end: max(16px, env(safe-area-inset-bottom));
  max-width: 460px; margin-inline: auto;
}
.mini button {
  width: 100%; min-height: 58px; border-radius: 999px;
  display: flex; align-items: center; gap: 12px; padding-inline: 20px 8px;
  background: var(--ink); color: var(--bg); border: 0; cursor: pointer; text-align: start;
  box-shadow: 0 12px 32px rgba(0,0,0,.28);
}
.mini .m-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .9rem; }
.mini .m-clock { font-size: 1.25rem; font-weight: 600; background: var(--accent); color: var(--on-accent); padding: 8px 14px; border-radius: 999px; direction: ltr; }

/* ---------- Recipe dialog ---------- */
dialog.recipe {
  padding: 0; border: 0; margin: 0;
  width: 100%; max-width: 100%; height: 100%; max-height: 100%;
  background: var(--bg); color: var(--ink); overflow: hidden;
}
dialog.recipe::backdrop { background: var(--shade); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
@media (min-width: 720px) {
  dialog.recipe {
    margin: auto; width: min(780px, calc(100% - 48px));
    height: calc(100dvh - 48px); border-radius: var(--r-lg);
    box-shadow: 0 30px 80px rgba(0,0,0,.4);
  }
}
.sheet { position: relative; height: 100%; }
.r-actions {
  position: absolute; z-index: 3; inset-block-start: 12px; inset-inline: 12px;
  display: flex; justify-content: flex-end; gap: 8px; pointer-events: none;
}
.r-actions > * { pointer-events: auto; }
.r-actions .heart { position: static; }
.x {
  width: var(--tap); height: var(--tap); border-radius: 999px;
  display: inline-flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.45); color: #fff; border: 1px solid rgba(255,255,255,.2); cursor: pointer;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.x svg { width: 18px; height: 18px; }
.r-scroll { height: 100%; overflow-y: auto; overscroll-behavior: contain; }
.r-hero { position: relative; margin: 0; height: min(46vh, 380px); background: var(--photo-fallback); color: #fff; }
.r-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.r-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,.85) 100%); }
.r-hero-body { position: absolute; z-index: 1; inset-inline: 0; inset-block-end: 0; padding: 20px; }
.r-hero h2 { margin: 0; font-size: clamp(1.7rem, 7vw, 2.4rem); line-height: 1.15; font-weight: 600; letter-spacing: -.02em; }
.r-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-block-start: 10px; }
.r-credit { position: absolute; z-index: 1; inset-block-start: 20px; inset-inline-start: 16px; font-size: .7rem; color: rgba(255,255,255,.75); max-width: 50%; }
.r-credit a { color: #fff; }

.r-body { padding: 4px 16px 48px; }
.r-blurb { margin: 16px 0 0; color: var(--ink-2); font-size: 1.02rem; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px 16px; margin-block-start: 14px; }
.panel h3 { margin: 0 0 12px; font-size: 1.05rem; font-weight: 600; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.panel h3 .aside { font-weight: 400; color: var(--ink-2); font-size: .85rem; }

.cups { display: grid; grid-template-columns: repeat(auto-fit, minmax(44px, 1fr)); gap: 4px; padding: 4px; background: var(--surface-2); border-radius: var(--r-md); }
.cup {
  min-height: 54px; border: 0; border-radius: 12px; background: transparent; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; padding: 4px 2px;
}
.cup .num { font-size: 1.05rem; font-weight: 600; }
.cup small { font-size: .68rem; color: var(--ink-2); }
.cup[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.cup[aria-pressed="true"] small { color: var(--bg); opacity: .75; }

/* Nutrition read-out under the cup control */
.nutri { margin-block-start: 12px; }
.n-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden;
}
.n-cell { padding: 10px 14px; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.n-cell + .n-cell { border-inline-start: 1px solid var(--line); }
.n-key { font-size: .76rem; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.n-fig { display: flex; align-items: baseline; gap: 5px; }
.n-fig .num { font-size: 1.5rem; font-weight: 600; line-height: 1.15; letter-spacing: -.02em; }
.n-fig small { font-size: .8rem; color: var(--ink-2); }
.n-share { margin: 8px 2px 0; font-size: .82rem; color: var(--ink-2); }
.r-note { margin: 20px 2px 0; font-size: .76rem; line-height: 1.5; color: var(--ink-2); }

.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: start; vertical-align: top; padding: 11px 4px; border-block-end: 1px solid var(--line); }
tr:last-child td { border-block-end: 0; }
thead th { font-size: .78rem; font-weight: 500; color: var(--ink-2); }
.ing td.amt { text-align: end; white-space: nowrap; width: 1%; }
.ing .amt .num { font-size: 1.3rem; font-weight: 600; }
.ing .amt .unit { color: var(--ink-2); font-size: .82rem; margin-inline-start: 5px; }
.fixed-badge { display: inline-block; margin-inline-start: 6px; font-size: .7rem; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); vertical-align: 2px; }
.fixes { min-width: 540px; }
.fixes td { font-size: .92rem; padding-inline: 8px; }
.fixes th { padding-inline: 8px; }
.fixes td:first-child { font-weight: 600; }

.steps { list-style: none; margin: 0; padding: 0; }
.step { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; padding-block: 12px; }
.step + .step { border-block-start: 1px solid var(--line); }
.step-n {
  width: 40px; height: 40px; border-radius: 999px; display: grid; place-items: center;
  background: var(--surface-2); font-weight: 600;
}
.step.is-running .step-n { background: var(--accent); color: var(--on-accent); }
.step.is-done .step-n { background: var(--ink); color: var(--bg); }
.step p { margin: 0; padding-block-start: 6px; }

.timer { margin-block-start: 12px; padding: 12px; border-radius: var(--r-md); background: var(--surface-2); }
.timer.running { background: color-mix(in srgb, var(--accent) 18%, var(--surface-2)); }
.t-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.t-clock { font-size: 2rem; font-weight: 600; line-height: 1; flex: 1; min-width: 5ch; direction: ltr; text-align: start; letter-spacing: -.02em; }
[dir="rtl"] .t-clock { text-align: end; }
.t-btn {
  min-height: var(--tap); min-width: 84px; padding-inline: 14px; border-radius: 999px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 0; cursor: pointer; font-weight: 600; background: var(--ink); color: var(--bg);
}
.t-btn svg { width: 15px; height: 15px; }
.timer.running .t-btn.go { background: var(--accent); color: var(--on-accent); }
@media (max-width: 400px) { .t-clock { flex-basis: 100%; } .t-btn.go { flex: 1; } }
.t-reset { min-width: var(--tap); width: var(--tap); padding: 0; background: var(--surface); color: var(--ink); border: 1px solid var(--line); }
.t-track { height: 5px; border-radius: 999px; background: var(--line-strong); margin-block-start: 10px; overflow: hidden; }
.t-fill { height: 100%; width: 0; background: var(--ink); border-radius: 999px; }
.timer.running .t-fill { background: var(--accent-ink); }
.timer.done .t-clock { color: var(--accent-ink); }

.why { margin: 0; font-size: 1rem; }
.panel.why-panel { background: var(--ink); color: var(--bg); border: 0; }
.panel.why-panel h3 { color: var(--accent); }

@media (prefers-reduced-motion: no-preference) {
  dialog.recipe[open] .sheet { animation: rise .28s cubic-bezier(.2, .8, .2, 1); }
  @keyframes rise { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
  .card-open img { transition: transform .5s cubic-bezier(.2, .8, .2, 1); }
  .card-open:hover img, .card-open:focus-visible img { transform: scale(1.04); }
  .t-fill { transition: width .25s linear; }
  .heart[aria-pressed="true"] svg { animation: pop .2s ease-out; }
  @keyframes pop { 50% { transform: scale(1.2); } }
}
</style>
</head>
<body>

<div class="top">
  <header class="bar">
    <h1 class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13v5a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3.5c0 1.2 1.2 1.3 1.2 2.5M12 3.5c0 1.2 1.2 1.3 1.2 2.5"/></svg></span>
      <span data-i18n="siteName"></span>
    </h1>
    <button class="icon-btn" id="langBtn" type="button"></button>
    <button class="icon-btn round" id="themeBtn" type="button"></button>
  </header>
  <nav class="filters" id="filters"></nav>
</div>

<section class="hero" aria-labelledby="heroTitle">
  <img src="img/hero.webp" alt="" width="1600" height="900" fetchpriority="high">
  <div class="hero-body">
    <h2 id="heroTitle" data-i18n="heroTitle"></h2>
    <p data-i18n="heroSub"></p>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <label for="q" class="sr-only" data-i18n="searchLabel"></label>
      <input id="q" type="search" autocomplete="off" enterkeyhint="search">
    </div>
  </div>
</section>

<main id="main">
  <div class="toolbar">
    <p id="count" aria-live="polite" aria-atomic="true"></p>
    <div class="sorter">
      <label for="sort" data-i18n="sortBy"></label>
      <select id="sort"></select>
    </div>
  </div>
  <div id="groups"></div>
  <div id="emptyBox" hidden></div>
</main>

<footer class="credits" id="credits"></footer>

<div class="mini" id="mini" hidden><button type="button" id="miniBtn"></button></div>

<dialog class="recipe" id="recipe" aria-labelledby="rTitle">
  <div class="sheet" id="sheet"></div>
</dialog>

<script type="module">
/* Recipe data, filter metadata, units and scaling live in recipes.js.
   Edit recipes there; this file only builds the UI around them.
   Photos: img/<recipe id>.webp (missing files fall back to a plain tile). */
import { RECIPES, EQUIPMENT, STYLES, UNITS, CUP_SIZES, scaleAmount, scaleNutrition } from "./recipes.js";

/* =====================================================================
   UI strings
   ===================================================================== */
const UI = {
  ar: {
    siteName: "بطاقة التحضير",
    heroTitle: "ماذا سنحضّر اليوم؟",
    heroSub: "مقادير دقيقة، خطوات مرتبة، ومؤقت لكل خطوة.",
    searchLabel: "ابحث عن مشروب", searchPh: "ابحث: لاتيه، تركية، مثلج…",
    switchLang: "EN", switchLangAria: "Switch to English",
    toDarkAria: "التبديل إلى الوضع الداكن", toLightAria: "التبديل إلى الوضع الفاتح",
    equipment: "الأداة", style: "النوع", all: "الكل", favOnly: "المفضلة", filtersNav: "الفلاتر",
    decaf: "كافيين منخفض", decafAria: "كافيين منخفض: 70 ملغ أو أقل للكوب",
    sortBy: "ترتيب حسب", sortName: "الاسم", sortCaffeine: "الكافيين: الأقل أولاً", sortCalories: "السعرات: الأقل أولاً",
    caffeine: "الكافيين", calories: "السعرات الحرارية", mg: "ملغ", kcal: "سعرة",
    dailyShare: "{pct}% من حد 400 ملغ اليومي",
    guideline: "400 ملغ يومياً — إرشادات EFSA وFDA للبالغين الأصحاء.",
    count: "{n} من {total} مشروب",
    drinksN: "{n} مشروب",
    emptyTitle: "لا توجد مشروبات تطابق هذه الفلاتر.",
    emptyHint: "أزل أحد هذه الفلاتر:",
    search: "البحث",
    clearAll: "مسح الكل",
    close: "إغلاق",
    addFav: "أضف {name} إلى المفضلة", removeFav: "أزل {name} من المفضلة",
    cupSize: "حجم الكوب", original: "الأصل", ml: "مل",
    ingredients: "المقادير", ingredient: "المكوّن", amount: "الكمية", fixed: "ثابت",
    scaledFor: "محسوبة لـ {ml} مل",
    steps: "الخطوات", why: "لماذا تنجح هذه الطريقة", mistakes: "أخطاء شائعة",
    problem: "المشكلة", cause: "السبب", fix: "الحل",
    start: "ابدأ", pause: "إيقاف", resume: "استئناف", restart: "من جديد", reset: "إعادة ضبط",
    tStarted: "بدأ مؤقت الخطوة {n}", tPaused: "توقف مؤقت الخطوة {n}", tReset: "أُعيد ضبط مؤقت الخطوة {n}", tDone: "انتهى وقت الخطوة {n}",
    miniRun: "{name}، الخطوة {n}", miniDone: "انتهى: {name}، الخطوة {n}",
    min: "د", hr: "س", totalTime: "الوقت الكلي",
    stepN: "الخطوة {n}",
    photoBy: "تصوير", creditsLine: "الصور من Unsplash.", creditsLink: "قائمة المصوّرين"
  },
  en: {
    siteName: "Brew Card",
    heroTitle: "What are we brewing today?",
    heroSub: "Exact amounts, ordered steps, and a timer on every step that needs one.",
    searchLabel: "Search drinks", searchPh: "Search: latte, turkish, iced…",
    switchLang: "ع", switchLangAria: "التبديل إلى العربية",
    toDarkAria: "Switch to dark theme", toLightAria: "Switch to light theme",
    equipment: "Gear", style: "Style", all: "All", favOnly: "Favorites", filtersNav: "Filters",
    decaf: "Decaf-friendly", decafAria: "Decaf-friendly: 70 mg or less per cup",
    sortBy: "Sort by", sortName: "Name", sortCaffeine: "Caffeine, lowest first", sortCalories: "Calories, lowest first",
    caffeine: "Caffeine", calories: "Calories", mg: "mg", kcal: "kcal",
    dailyShare: "{pct}% of a 400 mg daily limit",
    guideline: "400 mg/day — EFSA and FDA guidance for healthy adults.",
    count: "{n} of {total} drinks",
    drinksN: "{n} drinks",
    emptyTitle: "No drinks match these filters.",
    emptyHint: "Clear one of these filters:",
    search: "Search",
    clearAll: "Clear all",
    close: "Close",
    addFav: "Add {name} to favorites", removeFav: "Remove {name} from favorites",
    cupSize: "Cup size", original: "Recipe", ml: "ml",
    ingredients: "Ingredients", ingredient: "Ingredient", amount: "Amount", fixed: "fixed",
    scaledFor: "scaled for {ml} ml",
    steps: "Steps", why: "Why this works", mistakes: "Common mistakes",
    problem: "Problem", cause: "Cause", fix: "Fix",
    start: "Start", pause: "Pause", resume: "Resume", restart: "Again", reset: "Reset",
    tStarted: "Step {n} timer started", tPaused: "Step {n} timer paused", tReset: "Step {n} timer reset", tDone: "Step {n} time is up",
    miniRun: "{name}, step {n}", miniDone: "Done: {name}, step {n}",
    min: "min", hr: "h", totalTime: "Total time",
    stepN: "Step {n}",
    photoBy: "Photo", creditsLine: "Photos from Unsplash.", creditsLink: "Photographer credits"
  }
};
const EQUIP = Object.fromEntries(EQUIPMENT.map(e => [e.id, e]));
const STYLE = Object.fromEntries(STYLES.map(st => [st.id, st]));

/* Caffeine at or under this many mg per serving counts as decaf-friendly. */
const DECAF_MAX = 70;
const DAILY_LIMIT = 400;
const SORTS = [
  { id: "name",     label: "sortName" },
  { id: "caffeine", label: "sortCaffeine" },
  { id: "calories", label: "sortCalories" }
];

const ICONS = {
  heart: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path class="fill" d="M12 20.5s-7.5-4.6-9.2-9.3C1.7 8 3.8 4.5 7.3 4.5c2 0 3.6 1.1 4.7 2.7 1.1-1.6 2.7-2.7 4.7-2.7 3.5 0 5.6 3.5 4.5 6.7-1.7 4.7-9.2 9.3-9.2 9.3z"/></svg>',
  close: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  moon: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
  sun: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>',
  play: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>',
  reset: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg>',
  clock: '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  capsule: '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5h10l-1.5 8h-7z"/><path d="M2 5h12"/></svg>',
  filter: '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 3h12l-5 7v4H7v-4z"/></svg>',
  turkish: '<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5h7l-1 8H5z"/><path d="M11 6h4"/><path d="M3 5h9"/></svg>'
};

/* =====================================================================
   Storage (every access guarded)
   ===================================================================== */
const store = {
  get(key, fallback) {
    try {
      const raw = window.localStorage.getItem(key);
      if (raw == null) return fallback;
      const v = JSON.parse(raw);
      return v == null ? fallback : v;
    } catch (e) { return fallback; }
  },
  set(key, value) {
    try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* ignore */ }
  }
};

/* =====================================================================
   State
   ===================================================================== */
const byId = new Map(RECIPES.map(r => [r.id, r]));
const state = {
  lang: (() => { const l = store.get("brew.lang", "ar"); return l === "en" ? "en" : "ar"; })(),
  equip: new Set(),
  style: new Set(),
  favOnly: false,
  decaf: false,
  sort: (() => { const v = store.get("brew.sort", "name"); return SORTS.some(o => o.id === v) ? v : "name"; })(),
  q: "",
  favs: (() => {
    const f = store.get("brew.favs", []);
    return new Set(Array.isArray(f) ? f.filter(id => byId.has(id)) : []);
  })(),
  openId: null,
  cups: new Map(),
  returnFocus: null
};
const timers = new Map();  // "recipeId:stepIndex" -> { duration, remaining, running, endAt, done }
let lastDoneKey = null;
let credits = {};

/* =====================================================================
   Helpers
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const t = (key, vars) => {
  let s = UI[state.lang][key] ?? key;
  if (vars) for (const k in vars) s = s.replace("{" + k + "}", vars[k]);
  return s;
};
const L = obj => obj[state.lang];
const img = (name, w, h, extra) => `<img src="img/${esc(name)}.webp" alt="" width="${w}" height="${h}" ${extra || 'loading="lazy" decoding="async"'} onerror="this.remove()">`;

function fmtAmount(n) {
  const whole = Math.floor(n);
  if (Math.abs(n - whole - 0.5) < 1e-9) return (whole ? whole : "") + "½";
  return String(Math.round(n * 100) / 100);
}
function unitLabel(unit, n) {
  const u = UNITS[unit];
  if (!u) return unit;
  const label = u[state.lang] || unit;
  if (state.lang === "en" && n > 1 && (unit === "shot" || unit === "scoop")) return label + "s";
  return label;
}
function fmtClock(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  const p = n => String(n).padStart(2, "0");
  return h > 0 ? h + ":" + p(m) + ":" + p(ss) : p(m) + ":" + p(ss);
}
function timeLabel(minutes) {
  if (minutes >= 60) return (Math.round(minutes / 60 * 10) / 10) + " " + t("hr");
  return minutes + " " + t("min");
}
/* Both figures are reference values beside the recipe, so they read quietly:
   caffeine to the nearest 5 mg, calories to the nearest 5 kcal. */
function nutritionFor(r, ml) {
  return scaleNutrition(r, (ml || r.baseYield) / r.baseYield);
}
function nutriPills(r) {
  const n = nutritionFor(r, r.baseYield);
  const pill = (key, value, unit) =>
    `<span class="glass"><span class="sr-only">${esc(t(key))}: </span><span class="num">${value}</span><span class="u">${esc(t(unit))}</span></span>`;
  return pill("caffeine", n.caffeine, "mg") + pill("calories", n.calories, "kcal");
}
function heartBtn(r) {
  const on = state.favs.has(r.id);
  const label = t(on ? "removeFav" : "addFav", { name: L(r.name) });
  return `<button type="button" class="heart" data-action="fav" data-id="${esc(r.id)}" aria-pressed="${on}" aria-label="${esc(label)}">${ICONS.heart}</button>`;
}
function tagsHTML(r) {
  return `<span class="glass">${ICONS[r.equipment] || ""}${esc(L(EQUIP[r.equipment]))}</span>` +
    r.style.map(s => `<span class="glass">${esc(L(STYLE[s]))}</span>`).join("");
}

/* =====================================================================
   Header + filters
   ===================================================================== */
function effectiveTheme() {
  const attr = document.documentElement.getAttribute("data-theme");
  if (attr === "dark" || attr === "light") return attr;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function renderHeader() {
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.title = t("siteName");
  $("#q").placeholder = t("searchPh");
  const lb = $("#langBtn");
  lb.textContent = t("switchLang");
  lb.setAttribute("aria-label", t("switchLangAria"));
  const dark = effectiveTheme() === "dark";
  const tb = $("#themeBtn");
  tb.innerHTML = dark ? ICONS.sun : ICONS.moon;
  tb.setAttribute("aria-label", t(dark ? "toLightAria" : "toDarkAria"));
  const c = $("#credits");
  c.innerHTML = `${esc(t("creditsLine"))} <a href="img/CREDITS.txt">${esc(t("creditsLink"))}</a>`;
}
function renderFilters() {
  const f = $("#filters");
  f.setAttribute("aria-label", t("filtersNav"));
  const chip = (group, value, label, icon) => {
    const pressed = value === "all" ? state[group].size === 0 : state[group].has(value);
    return `<button type="button" class="chip" data-action="filter" data-group="${group}" data-value="${value}" aria-pressed="${pressed}">${icon || ""}<span>${esc(label)}</span></button>`;
  };
  const eq = EQUIPMENT.map(e => chip("equip", e.id, L(e), ICONS[e.id])).join("");
  const st = STYLES.map(s => chip("style", s.id, L(s))).join("");
  f.innerHTML = `
    <div class="frow" role="group" aria-labelledby="fl-eq">
      <span class="flabel" id="fl-eq">${esc(t("equipment"))}</span>
      ${chip("equip", "all", t("all"))}${eq}
    </div>
    <div class="frow" role="group" aria-labelledby="fl-st">
      <span class="flabel" id="fl-st">${esc(t("style"))}</span>
      ${chip("style", "all", t("all"))}${st}
      <span class="fsep" aria-hidden="true"></span>
      <button type="button" class="chip" data-action="decaf" aria-pressed="${state.decaf}" aria-label="${esc(t("decafAria"))}"><span>${esc(t("decaf"))}</span></button>
      <button type="button" class="chip fav-chip" data-action="favonly" aria-pressed="${state.favOnly}">${ICONS.heart}<span>${esc(t("favOnly"))}</span></button>
    </div>`;
}

/* =====================================================================
   Sorting
   ===================================================================== */
function renderSort() {
  const sel = $("#sort");
  sel.innerHTML = SORTS.map(o =>
    `<option value="${o.id}"${o.id === state.sort ? " selected" : ""}>${esc(t(o.label))}</option>`).join("");
  sel.value = state.sort;
}
function sorted(list) {
  const byName = (a, b) => L(a.name).localeCompare(L(b.name), state.lang);
  const copy = list.slice();
  if (state.sort === "caffeine") copy.sort((a, b) => a.caffeine - b.caffeine || byName(a, b));
  else if (state.sort === "calories") copy.sort((a, b) => a.calories - b.calories || byName(a, b));
  else copy.sort(byName);
  return copy;
}

/* =====================================================================
   Grid (grouped by equipment, with a photo banner per group)
   ===================================================================== */
const norm = s => String(s).toLowerCase().normalize("NFKD").replace(/[ً-ٰٟ]/g, "");
function matchesQuery(r) {
  if (!state.q) return true;
  const q = norm(state.q.trim());
  if (!q) return true;
  return [r.name.ar, r.name.en, r.blurb.ar, r.blurb.en, r.id].some(s => norm(s).includes(q));
}
function filtered() {
  return sorted(RECIPES.filter(r =>
    (state.equip.size === 0 || state.equip.has(r.equipment)) &&
    (state.style.size === 0 || r.style.some(s => state.style.has(s))) &&
    (!state.decaf || r.caffeine <= DECAF_MAX) &&
    (!state.favOnly || state.favs.has(r.id)) &&
    matchesQuery(r)
  ));
}
function cardHTML(r) {
  return `<li class="card">
    <button type="button" class="card-open" data-action="open" data-id="${esc(r.id)}">
      ${img(r.id, 800, 1000)}
      <span class="c-top">${tagsHTML(r)}</span>
      <span class="c-bottom">
        <span class="c-name">${esc(L(r.name))}</span>
        <span class="c-blurb">${esc(L(r.blurb))}</span>
        <span class="c-meta"><span class="glass time">${ICONS.clock}<span class="sr-only">${esc(t("totalTime"))}: </span><span class="num">${esc(timeLabel(r.minutes))}</span></span>${nutriPills(r)}</span>
      </span>
    </button>
    ${heartBtn(r)}
  </li>`;
}
function renderGrid() {
  const list = filtered();
  $("#count").innerHTML = esc(t("count", { n: "␀", total: RECIPES.length })).replace("␀", `<strong class="num">${list.length}</strong>`);
  $("#groups").innerHTML = EQUIPMENT.map(e => {
    const items = list.filter(r => r.equipment === e.id);
    if (!items.length) return "";
    return `<section class="group" aria-labelledby="g-${e.id}">
      <div class="banner">${img(e.id, 1600, 900)}<h2 id="g-${e.id}">${esc(L(e))}<span class="n">${esc(t("drinksN", { n: items.length }))}</span></h2></div>
      <ul class="grid">${items.map(cardHTML).join("")}</ul>
    </section>`;
  }).join("");
  renderEmpty(list.length === 0);
}
function renderEmpty(show) {
  const box = $("#emptyBox");
  box.hidden = !show;
  if (!show) { box.innerHTML = ""; return; }
  const clears = [];
  if (state.q.trim()) clears.push(`<button type="button" class="btn" data-action="clear" data-group="q">${ICONS.close}${esc(t("search"))}: ${esc(state.q.trim())}</button>`);
  if (state.equip.size) clears.push(`<button type="button" class="btn" data-action="clear" data-group="equip">${ICONS.close}${esc(t("equipment"))}: ${esc([...state.equip].map(k => L(EQUIP[k])).join(" / "))}</button>`);
  if (state.style.size) clears.push(`<button type="button" class="btn" data-action="clear" data-group="style">${ICONS.close}${esc(t("style"))}: ${esc([...state.style].map(k => L(STYLE[k])).join(" / "))}</button>`);
  if (state.decaf) clears.push(`<button type="button" class="btn" data-action="clear" data-group="decaf">${ICONS.close}${esc(t("decaf"))}</button>`);
  if (state.favOnly) clears.push(`<button type="button" class="btn" data-action="clear" data-group="fav">${ICONS.close}${esc(t("favOnly"))}</button>`);
  box.className = "empty";
  box.innerHTML = `${img("beans", 1600, 900)}<div><h2>${esc(t("emptyTitle"))}</h2>
    <p>${esc(t("emptyHint"))}</p>
    <div class="clears">${clears.join("")}<button type="button" class="btn primary" data-action="clear" data-group="all">${esc(t("clearAll"))}</button></div></div>`;
}

/* =====================================================================
   Recipe view
   ===================================================================== */
const dialog = $("#recipe");

function cupFor(r) { return state.cups.get(r.id) || r.baseYield; }

function renderCups(r) {
  const cur = cupFor(r);
  const sizes = CUP_SIZES.includes(r.baseYield) ? CUP_SIZES : [r.baseYield, ...CUP_SIZES];
  return sizes.map(ml => {
    const isBase = ml === r.baseYield && !CUP_SIZES.includes(ml);
    return `<button type="button" class="cup" data-action="cup" data-ml="${ml}" aria-pressed="${ml === cur}" aria-label="${ml} ${esc(t("ml"))}${isBase ? " (" + esc(t("original")) + ")" : ""}">
      <span class="num">${ml}</span><small>${esc(isBase ? t("original") : t("ml"))}</small></button>`;
  }).join("");
}
function renderNutrition(r) {
  const n = nutritionFor(r, cupFor(r));
  const pct = Math.round(n.caffeine / DAILY_LIMIT * 100);
  const cell = (key, value, unit) =>
    `<div class="n-cell"><span class="n-key">${esc(t(key))}</span>
      <span class="n-fig"><span class="num">${value}</span><small>${esc(t(unit))}</small></span></div>`;
  return `<div class="n-grid">${cell("caffeine", n.caffeine, "mg")}${cell("calories", n.calories, "kcal")}</div>
    <p class="n-share">${esc(t("dailyShare", { pct }))}</p>`;
}
function renderIngredients(r) {
  const factor = cupFor(r) / r.baseYield;
  return r.ingredients.map(ing => {
    const n = scaleAmount(ing, factor);
    return `<tr>
      <td>${esc(L(ing))}${ing.fixed ? `<span class="fixed-badge">${esc(t("fixed"))}</span>` : ""}</td>
      <td class="amt"><span class="num">${fmtAmount(n)}</span><span class="unit">${esc(unitLabel(ing.unit, n))}</span></td>
    </tr>`;
  }).join("");
}
function timerHTML(key, i) {
  return `<div class="timer" data-timer="${key}">
    <div class="t-row">
      <span class="t-clock num" role="timer" aria-label="${esc(t("stepN", { n: i + 1 }))}"></span>
      <button type="button" class="t-btn go" data-action="t-toggle" data-key="${key}"></button>
      <button type="button" class="t-btn t-reset" data-action="t-reset" data-key="${key}" aria-label="${esc(t("reset"))}">${ICONS.reset}</button>
    </div>
    <div class="t-track" aria-hidden="true"><div class="t-fill"></div></div>
    <span class="sr-only t-status" aria-live="polite"></span>
  </div>`;
}
function creditHTML(id) {
  const c = credits[id];
  if (!c) return "";
  return `<span class="r-credit">${esc(t("photoBy"))}: <a href="https://unsplash.com/@${esc(c.uname)}" target="_blank" rel="noopener">${esc(c.user)}</a></span>`;
}
function renderRecipe() {
  const r = byId.get(state.openId);
  if (!r) return;
  const steps = r.steps.map((s, i) => {
    const key = r.id + ":" + i;
    if (s.seconds) getTimer(key, s.seconds);
    return `<li class="step" data-step="${key}">
      <span class="step-n num" aria-hidden="true">${i + 1}</span>
      <div><p><span class="sr-only">${esc(t("stepN", { n: i + 1 }))}: </span>${esc(L(s))}</p>${s.seconds ? timerHTML(key, i) : ""}</div>
    </li>`;
  }).join("");
  const fixes = r.fixes.map(f => `<tr><td>${esc(L(f.problem))}</td><td>${esc(L(f.cause))}</td><td>${esc(L(f.fix))}</td></tr>`).join("");
  $("#sheet").innerHTML = `
    <div class="r-actions">
      ${heartBtn(r)}
      <button type="button" class="x" data-action="close" aria-label="${esc(t("close"))}">${ICONS.close}</button>
    </div>
    <div class="r-scroll" id="rScroll">
      <figure class="r-hero">
        ${img(r.id, 800, 1000, 'decoding="async"')}
        ${creditHTML(r.id)}
        <figcaption class="r-hero-body">
          <h2 id="rTitle">${esc(L(r.name))}</h2>
          <div class="r-tags">${tagsHTML(r)}<span class="glass time">${ICONS.clock}<span class="sr-only">${esc(t("totalTime"))}: </span><span class="num">${esc(timeLabel(r.minutes))}</span></span></div>
        </figcaption>
      </figure>
      <div class="r-body">
        <p class="r-blurb">${esc(L(r.blurb))}</p>
        <section class="panel" aria-labelledby="h-cup">
          <h3 id="h-cup">${esc(t("cupSize"))}</h3>
          <div class="cups" role="group" aria-labelledby="h-cup" id="cups">${renderCups(r)}</div>
          <div class="nutri" id="nutri" aria-live="polite">${renderNutrition(r)}</div>
        </section>
        <section class="panel" aria-labelledby="h-ing">
          <h3 id="h-ing">${esc(t("ingredients"))} <span class="aside" id="ingFor">${esc(t("scaledFor", { ml: cupFor(r) }))}</span></h3>
          <div class="scroll"><table class="ing">
            <thead><tr><th scope="col">${esc(t("ingredient"))}</th><th scope="col" style="text-align:end">${esc(t("amount"))}</th></tr></thead>
            <tbody id="ingBody" aria-live="polite">${renderIngredients(r)}</tbody>
          </table></div>
        </section>
        <section class="panel" aria-labelledby="h-steps">
          <h3 id="h-steps">${esc(t("steps"))}</h3>
          <ol class="steps">${steps}</ol>
        </section>
        <section class="panel why-panel" aria-labelledby="h-why">
          <h3 id="h-why">${esc(t("why"))}</h3>
          <p class="why">${esc(L(r.why))}</p>
        </section>
        <section class="panel" aria-labelledby="h-fix">
          <h3 id="h-fix">${esc(t("mistakes"))}</h3>
          <div class="scroll" tabindex="0" aria-labelledby="h-fix"><table class="fixes">
            <thead><tr><th scope="col">${esc(t("problem"))}</th><th scope="col">${esc(t("cause"))}</th><th scope="col">${esc(t("fix"))}</th></tr></thead>
            <tbody>${fixes}</tbody>
          </table></div>
        </section>
        <p class="r-note">${esc(t("guideline"))}</p>
      </div>
    </div>`;
  r.steps.forEach((s, i) => { if (s.seconds) paintTimer(r.id + ":" + i); });
}
function updateScale() {
  const r = byId.get(state.openId);
  if (!r) return;
  $("#cups").querySelectorAll(".cup").forEach(b => b.setAttribute("aria-pressed", String(Number(b.dataset.ml) === cupFor(r))));
  $("#nutri").innerHTML = renderNutrition(r);
  $("#ingBody").innerHTML = renderIngredients(r);
  $("#ingFor").textContent = t("scaledFor", { ml: cupFor(r) });
}

function openRecipe(id, returnEl, focusStepKey) {
  if (!byId.has(id)) return;
  state.openId = id;
  state.returnFocus = returnEl || document.activeElement;
  renderRecipe();
  if (!dialog.open) {
    dialog.showModal();
    document.documentElement.classList.add("locked");
    try { if (!(history.state && history.state.recipe)) history.pushState({ recipe: id }, ""); } catch (e) {}
  }
  $("#rScroll").scrollTop = 0;
  if (focusStepKey) {
    const el = dialog.querySelector(`[data-step="${focusStepKey}"]`);
    if (el) { const sc = $("#rScroll"); sc.scrollTop = el.getBoundingClientRect().top - sc.getBoundingClientRect().top - sc.clientHeight / 3; const b = el.querySelector('[data-action="t-toggle"]'); if (b) b.focus(); return; }
  }
  dialog.querySelector(".x").focus();
}
function requestClose() {
  let viaHistory = false;
  try { if (history.state && history.state.recipe) { viaHistory = true; history.back(); } } catch (e) {}
  if (!viaHistory) dialog.close();
}
dialog.addEventListener("close", () => {
  document.documentElement.classList.remove("locked");
  state.openId = null;
  const back = state.returnFocus;
  state.returnFocus = null;
  if (back && document.contains(back) && !back.closest("dialog")) back.focus();
  else { const h = document.querySelector(".card-open"); if (h) h.focus(); }
  updateMini();
});
dialog.addEventListener("cancel", e => { e.preventDefault(); requestClose(); });
dialog.addEventListener("click", e => { if (e.target === dialog) requestClose(); });
window.addEventListener("popstate", () => { if (dialog.open) dialog.close(); });
dialog.addEventListener("keydown", e => {
  if (e.key !== "Tab") return;
  const items = [...dialog.querySelectorAll('button:not([disabled]), [href], [tabindex]:not([tabindex="-1"])')].filter(el => el.offsetParent !== null || el === document.activeElement);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

/* =====================================================================
   Timers
   ===================================================================== */
let audioCtx = null;
function ensureAudio() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) { audioCtx = null; }
}
function beep() {
  try {
    ensureAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    [0, 0.22, 0.44].forEach(offset => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = 1320;
      gain.gain.setValueAtTime(0.0001, now + offset);
      gain.gain.exponentialRampToValueAtTime(0.3, now + offset + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.16);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now + offset);
      osc.stop(now + offset + 0.17);
    });
  } catch (e) { /* audio unavailable */ }
  try { if (navigator.vibrate) navigator.vibrate([180, 80, 180]); } catch (e) {}
}
function getTimer(key, seconds) {
  let tm = timers.get(key);
  if (!tm) {
    tm = { duration: seconds * 1000, remaining: seconds * 1000, running: false, endAt: 0, done: false };
    timers.set(key, tm);
  }
  return tm;
}
const stepIndex = key => Number(key.split(":")[1]);
function announce(key, msgKey) {
  const el = dialog.querySelector(`[data-timer="${key}"] .t-status`);
  if (el) el.textContent = t(msgKey, { n: stepIndex(key) + 1 });
}
function startTimer(key) {
  timers.forEach((other, k) => { if (k !== key && other.running) pauseTimer(k, true); });
  const tm = timers.get(key);
  if (tm.done || tm.remaining <= 0) { tm.remaining = tm.duration; tm.done = false; }
  tm.running = true;
  tm.endAt = Date.now() + tm.remaining;
  if (lastDoneKey === key) lastDoneKey = null;
  ensureAudio();
  ensureTick();
  paintTimer(key);
  announce(key, "tStarted");
}
function pauseTimer(key, silent) {
  const tm = timers.get(key);
  if (!tm || !tm.running) return;
  tm.remaining = Math.max(0, tm.endAt - Date.now());
  tm.running = false;
  paintTimer(key);
  if (!silent) announce(key, "tPaused");
}
function resetTimer(key) {
  const tm = timers.get(key);
  if (!tm) return;
  tm.running = false; tm.done = false; tm.remaining = tm.duration;
  if (lastDoneKey === key) lastDoneKey = null;
  paintTimer(key);
  announce(key, "tReset");
  updateMini();
}
let tickHandle = null;
function ensureTick() { if (!tickHandle) tickHandle = setInterval(tick, 250); }
function tick() {
  let any = false;
  timers.forEach((tm, key) => {
    if (!tm.running) return;
    tm.remaining = Math.max(0, tm.endAt - Date.now());
    if (tm.remaining <= 0) {
      tm.running = false; tm.done = true; lastDoneKey = key;
      beep();
      announce(key, "tDone");
    } else any = true;
    paintTimer(key);
  });
  updateMini();
  if (!any) { clearInterval(tickHandle); tickHandle = null; }
}
function paintTimer(key) {
  const tm = timers.get(key);
  const box = dialog.querySelector(`[data-timer="${key}"]`);
  if (!tm || !box) return;
  box.querySelector(".t-clock").textContent = fmtClock(tm.remaining);
  box.querySelector(".t-fill").style.width = ((1 - tm.remaining / tm.duration) * 100).toFixed(2) + "%";
  box.classList.toggle("running", tm.running);
  box.classList.toggle("done", tm.done);
  const btn = box.querySelector('[data-action="t-toggle"]');
  let label, icon = ICONS.play;
  if (tm.running) { label = t("pause"); icon = ICONS.pause; }
  else if (tm.done) label = t("restart");
  else if (tm.remaining < tm.duration) label = t("resume");
  else label = t("start");
  btn.innerHTML = icon + `<span>${esc(label)}</span>`;
  btn.setAttribute("aria-label", `${label}: ${t("stepN", { n: stepIndex(key) + 1 })}`);
  const step = box.closest(".step");
  if (step) { step.classList.toggle("is-running", tm.running); step.classList.toggle("is-done", tm.done); }
}
function runningKey() {
  for (const [k, tm] of timers) if (tm.running) return k;
  return null;
}
function updateMini() {
  const mini = $("#mini");
  const key = runningKey() || lastDoneKey;
  if (!key || dialog.open) { mini.hidden = true; return; }
  const tm = timers.get(key);
  const r = byId.get(key.split(":")[0]);
  const done = !tm.running;
  mini.hidden = false;
  const text = t(done ? "miniDone" : "miniRun", { name: L(r.name), n: stepIndex(key) + 1 });
  $("#miniBtn").dataset.key = key;
  $("#miniBtn").innerHTML = `<span class="m-text">${esc(text)}</span><span class="m-clock num" role="timer">${fmtClock(tm.remaining)}</span>`;
}

/* =====================================================================
   Events
   ===================================================================== */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "open") openRecipe(el.dataset.id, el);
  else if (a === "close") requestClose();
  else if (a === "fav") toggleFav(el.dataset.id, el);
  else if (a === "filter") setFilter(el.dataset.group, el.dataset.value);
  else if (a === "favonly") { state.favOnly = !state.favOnly; renderFilters(); renderGrid(); focusSame('[data-action="favonly"]'); }
  else if (a === "decaf") { state.decaf = !state.decaf; renderFilters(); renderGrid(); focusSame('[data-action="decaf"]'); }
  else if (a === "clear") clearFilter(el.dataset.group);
  else if (a === "cup") { state.cups.set(state.openId, Number(el.dataset.ml)); updateScale(); }
  else if (a === "t-toggle") { const k = el.dataset.key; timers.get(k).running ? pauseTimer(k) : startTimer(k); }
  else if (a === "t-reset") resetTimer(el.dataset.key);
});
$("#miniBtn").addEventListener("click", () => {
  const key = $("#miniBtn").dataset.key;
  if (!key) return;
  if (lastDoneKey === key && !timers.get(key).running) lastDoneKey = null;
  openRecipe(key.split(":")[0], $("#miniBtn"), key);
});
$("#q").addEventListener("input", e => { state.q = e.target.value; renderGrid(); });
$("#sort").addEventListener("change", e => {
  state.sort = SORTS.some(o => o.id === e.target.value) ? e.target.value : "name";
  store.set("brew.sort", state.sort);
  renderGrid();
});
$("#langBtn").addEventListener("click", () => {
  state.lang = state.lang === "ar" ? "en" : "ar";
  store.set("brew.lang", state.lang);
  applyLang();
  $("#langBtn").focus();
});
$("#themeBtn").addEventListener("click", () => {
  const next = effectiveTheme() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  store.set("brew.theme", next);
  renderHeader();
  $("#themeBtn").focus();
});
if (window.matchMedia) {
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  const onChange = () => renderHeader();
  if (mq.addEventListener) mq.addEventListener("change", onChange); else if (mq.addListener) mq.addListener(onChange);
}

function focusSame(selector) {
  const el = document.querySelector(selector);
  if (el) el.focus();
  return !!el;
}
function setFilter(group, value) {
  const set = state[group];
  if (value === "all") set.clear();
  else if (set.has(value)) set.delete(value);
  else set.add(value);
  renderFilters();
  renderGrid();
  focusSame(`[data-action="filter"][data-group="${group}"][data-value="${value}"]`);
}
function clearFilter(group) {
  if (group === "equip" || group === "all") state.equip.clear();
  if (group === "style" || group === "all") state.style.clear();
  if (group === "decaf" || group === "all") state.decaf = false;
  if (group === "fav" || group === "all") state.favOnly = false;
  if (group === "q" || group === "all") { state.q = ""; $("#q").value = ""; }
  renderFilters();
  renderGrid();
  focusSame('#emptyBox [data-action="clear"]') || focusSame(".card-open");
}
function toggleFav(id, fromEl) {
  if (state.favs.has(id)) state.favs.delete(id); else state.favs.add(id);
  store.set("brew.favs", [...state.favs]);
  const inDialog = fromEl && fromEl.closest("dialog");
  renderGrid();
  if (dialog.open) {
    const r = byId.get(state.openId);
    const h = dialog.querySelector(".r-actions .heart");
    if (h && r) h.outerHTML = heartBtn(r);
    if (inDialog) focusSame(".r-actions .heart");
  }
  if (!inDialog) focusSame(`#groups .heart[data-id="${id}"]`) || focusSame(".card-open") || focusSame("#emptyBox button");
}

function applyLang() {
  const html = document.documentElement;
  html.lang = state.lang;
  html.dir = state.lang === "ar" ? "rtl" : "ltr";
  renderHeader();
  renderFilters();
  renderSort();
  renderGrid();
  if (dialog.open) renderRecipe();
  updateMini();
}

/* ---------- Boot ---------- */
(function boot() {
  const theme = store.get("brew.theme", null);
  if (theme === "dark" || theme === "light") document.documentElement.setAttribute("data-theme", theme);
  try { if (history.state && history.state.recipe) history.replaceState(null, ""); } catch (e) {}
  applyLang();
  fetch("img/credits.json").then(r => r.ok ? r.json() : {}).then(c => { credits = c || {}; }).catch(() => {});
})();
</script>
</body>
</html>
